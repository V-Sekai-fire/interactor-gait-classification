# Dedicated AutoGluon env — isolated because autogluon needs pandas<2.2,
# conflicting with the main gait env's pandas 3.x.
[workspace]
name = "agl"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
autogluon-tabular = "==1.5.0"
typing-extensions = ">=4.15.0, <5"
torch = ">=2.12.0, <3"
pytabkit = ">=1.7.3, <2"
lightgbm = ">=4.6.0, <5"
xgboost = ">=3.2.0, <4"
catboost = ">=1.2.10, <2"
tabpfn = ">=8.0.8, <9"
tabdpt = ">=1.2.0, <2"
kaggle = ">=2.2.1, <3"

[tasks]
train = "python train_classifiers.py"
